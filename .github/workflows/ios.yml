name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ["android/**"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload a signed build to App Store Connect/TestFlight"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync ios

      - name: Build unsigned iOS simulator app
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator build
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: golfmatch-ios-simulator
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

      - name: Sign and upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          : "${ASC_KEY_ID:?Missing GitHub secret ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing GitHub secret ASC_ISSUER_ID}"
          : "${ASC_KEY_P8:?Missing GitHub secret ASC_KEY_P8}"
          : "${APPLE_TEAM_ID:?Missing GitHub secret APPLE_TEAM_ID}"
          : "${IOS_CERTIFICATE_P12_BASE64:?Missing GitHub secret IOS_CERTIFICATE_P12_BASE64}"
          : "${IOS_CERTIFICATE_PASSWORD:?Missing GitHub secret IOS_CERTIFICATE_PASSWORD}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Missing GitHub secret IOS_PROVISIONING_PROFILE_BASE64}"

          KEYCHAIN_PATH="$RUNNER_TEMP/golfmatch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          PROFILE_PATH="$RUNNER_TEMP/golfmatch.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=""

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -f "$PROFILE_PATH" "$PROFILE_PLIST" "$API_KEY_PATH" \
              "$RUNNER_TEMP/distribution.p12"
            if [[ -n "$PROFILE_UUID" ]]; then
              rm -f "$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"
            fi
          }
          trap cleanup EXIT

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          printf '%s' "$ASC_KEY_P8" > "$API_KEY_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$PROFILE_INSTALL_DIR"
          cp "$PROFILE_PATH" \
            "$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GolfMatch.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>io.github.jonharald123cloud.golfmatch</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GolfMatch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
